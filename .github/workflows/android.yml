
name: Build Apple Style TV APK
# Rebuild after configuring permanent signing secrets

on:
  push:
    branches:
      - main-mobile
      - feature/weather-vpn-widgets
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 34
        run: |
          sdkmanager "platforms;android-34" \
                     "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Restore permanent release signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.TV_SIGNING_KEYSTORE_BASE64 }}
          TV_SIGNING_STORE_PASSWORD: ${{ secrets.TV_SIGNING_STORE_PASSWORD }}
          TV_SIGNING_KEY_ALIAS: ${{ secrets.TV_SIGNING_KEY_ALIAS }}
          TV_SIGNING_KEY_PASSWORD: ${{ secrets.TV_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo 'Missing TV_SIGNING_KEYSTORE_BASE64 secret'; exit 1; }
          test -n "$TV_SIGNING_STORE_PASSWORD" || { echo 'Missing signing store password'; exit 1; }
          test -n "$TV_SIGNING_KEY_ALIAS" || { echo 'Missing signing key alias'; exit 1; }
          test -n "$TV_SIGNING_KEY_PASSWORD" || { echo 'Missing signing key password'; exit 1; }
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apple-style-release.jks"
          chmod 600 "$RUNNER_TEMP/apple-style-release.jks"
          echo "TV_SIGNING_KEYSTORE=$RUNNER_TEMP/apple-style-release.jks" >> "$GITHUB_ENV"
          echo "TV_SIGNING_STORE_PASSWORD=$TV_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TV_SIGNING_KEY_ALIAS=$TV_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TV_SIGNING_KEY_PASSWORD=$TV_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease :updater:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find and prepare APK
        run: |
          mkdir -p output
          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 -name "*.apk" \
            -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          cp "$APK" output/AppleStyleTV.apk
          cp updater/build/outputs/apk/release/updater-release.apk output/AppleStyleTV-Updater.apk
          test -s output/AppleStyleTV.apk
          test -s output/AppleStyleTV-Updater.apk
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppleStyleTV-and-Updater-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
